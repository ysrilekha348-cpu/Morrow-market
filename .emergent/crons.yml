crons:
  - name: summary-7am
    description: "Sends the owner's morning sales summary if 7am IST is the chosen time"
    cron: "0 7 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/daily-summary"
    method: POST
    enabled: true
  - name: summary-8am
    description: "Sends the owner's morning sales summary if 8am IST is the chosen time"
    cron: "0 8 * * *"
    timezone: "Asia/Kolkata"
